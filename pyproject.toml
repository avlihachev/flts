[project]
name = "flts"
version = "0.1.0"
description = "Flight search agent powered by Claude Agent SDK and Google Flights"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "flights>=0.8.0",
    "python-telegram-bot>=21.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
flts = "flts.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
